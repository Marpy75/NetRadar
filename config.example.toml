# NetRadar RouterOS Connection Configuration Template
# Create your actual config OUTSIDE the project directory (e.g., C:/Users/<User>/.netradar_config.toml)
# and point the environment variable NETRADAR_CONFIG to it:
# $env:NETRADAR_CONFIG = "C:/Users/<User>/.netradar_config.toml"

host = "192.168.88.1"
port = 443
username = "netradar_reader"
password = "your_secure_password"
ca_path = "C:/path/to/router_certificate.pem"
wan_interface = "ether1"
# Set to false if connecting via IP address and the router's self-signed cert was issued for a hostname:
check_hostname = false
